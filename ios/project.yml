name: Rev
options:
  bundleIdPrefix: app.driverev
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 543LGZY2RD
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  RevKit:
    path: RevKit

targets:
  Rev:
    type: application
    platform: iOS
    sources:
      - path: Rev
    entitlements:
      path: Rev/Rev.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    dependencies:
      - package: RevKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.driverev.Rev
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_CFBundleDisplayName: Rev
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Rev records your drives to claim territory on the map."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "Rev tracks your movement in the background to claim territory as you drive, bike, or walk."
        INFOPLIST_KEY_NSMotionUsageDescription: "Rev uses motion activity to start and stop drive recording automatically and save battery."
        INFOPLIST_FILE: Rev/Info.plist
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  Rev:
    build:
      targets:
        Rev: all
    test:
      testPlans:
        - path: Rev.xctestplan
          defaultPlan: true
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
