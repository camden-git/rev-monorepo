name: Rev
options:
  bundleIdPrefix: app.driverev
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  RevKit:
    path: RevKit

targets:
  Rev:
    type: application
    platform: iOS
    sources:
      - path: Rev
    dependencies:
      - package: RevKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.driverev.Rev
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_CFBundleDisplayName: Rev
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Rev shows your position on the map"
        TARGETED_DEVICE_FAMILY: "1"
